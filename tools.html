<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="Free Stock Photos, PNGs, Templates & Mockups _ rawpixel.jpg">

<title>Tools I Use - 3D Animated</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Roboto', sans-serif;

  background:
    radial-gradient(circle at 20% 20%, rgba(0,123,255,0.12), transparent 30%),
    radial-gradient(circle at 80% 80%, rgba(0,86,179,0.10), transparent 30%),
    #f8fafc;

  background-image:
    linear-gradient(to right, rgba(0,0,0,0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(0,0,0,0.035) 1px, transparent 1px);

  background-size: 30px 30px;

  padding: 25px 40px 60px;

  display: flex;
  flex-direction: column;
  align-items: center;

  overflow-x: hidden;
  perspective: 1200px;
}


/* =========================
   BACK HOME
========================= */

.back-home {
  align-self: flex-start;

  text-decoration: none;
  color: #007bff;

  font-weight: 700;

  display: flex;
  align-items: center;
  gap: 9px;

  padding: 10px 16px;

  border-radius: 10px;

  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);

  border: 1px solid rgba(0,123,255,0.12);

  box-shadow: 0 5px 20px rgba(0,0,0,0.05);

  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
              box-shadow 0.4s ease, 
              color 0.3s ease;
  
  animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.back-home i {
  transition: transform 0.3s ease;
}

.back-home:hover {
  color: #0056b3;
  transform: translateX(-5px) scale(1.03) translateZ(10px);
  box-shadow: 0 8px 25px rgba(0,123,255,0.2);
}

.back-home:hover i {
  transform: translateX(-4px);
}


/* =========================
   TITLE
========================= */

.section-title {
  text-align: center;

  margin-top: 20px;
  margin-bottom: 50px;

  position: relative;
  animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.section-title h2 {
  margin: 0;

  font-size: 36px;
  font-weight: 800;

  color: #111827;

  letter-spacing: 0.5px;
}

.section-title h2 span {
  color: #007bff;
  display: inline-block;
  transition: transform 0.3s ease;
}

.section-title:hover h2 span {
  transform: scale(1.1) rotate(-2deg);
}

.section-title p {
  margin-top: 10px;

  color: #64748b;

  font-size: 15px;
}

/* Blue underline */

.section-title::after {
  content: "";

  display: block;

  width: 65px;
  height: 4px;

  margin: 15px auto 0;

  border-radius: 20px;

  background: linear-gradient(
    90deg,
    #007bff,
    #00aaff
  );

  box-shadow: 0 0 12px rgba(0,123,255,0.4);
  transition: width 0.4s ease, box-shadow 0.4s ease;
}

.section-title:hover::after {
  width: 110px;
  box-shadow: 0 0 20px rgba(0,123,255,0.7);
}


/* =========================
   TOOLS CONTAINER
========================= */

.tools-container {
  width: 100%;
  max-width: 1050px;

  display: grid;

  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

  gap: 30px;
  perspective: 1000px;
}


/* =========================
   TOOL CARD (3D Dynamic)
========================= */

.tool-card {
  position: relative;

  min-height: 160px;

  padding: 25px;

  border-radius: 22px;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.95),
    rgba(248,250,252,0.85)
  );

  border: 1px solid rgba(0,123,255,0.12);

  box-shadow: 0 10px 30px rgba(15,23,42,0.06);

  display: flex;
  flex-direction: column;

  align-items: center;
  justify-content: center;

  text-align: center;

  overflow: hidden;

  cursor: pointer;

  transform-style: preserve-3d;

  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1),
              box-shadow 0.5s cubic-bezier(0.23, 1, 0.32, 1),
              border-color 0.4s ease;

  opacity: 0;
  animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Staggered entrance animation for cards */
.tool-card:nth-child(1) { animation-delay: 0.15s; }
.tool-card:nth-child(2) { animation-delay: 0.25s; }
.tool-card:nth-child(3) { animation-delay: 0.35s; }
.tool-card:nth-child(4) { animation-delay: 0.45s; }
.tool-card:nth-child(5) { animation-delay: 0.55s; }

/* Top blue line */

.tool-card::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 4px;

  background: linear-gradient(
    90deg,
    #007bff,
    #00b7ff
  );

  transform: scaleX(0);

  transform-origin: left;

  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 2;
}

/* 3D Glow */

.tool-card::after {
  content: "";

  position: absolute;

  width: 120px;
  height: 120px;

  border-radius: 50%;

  background: rgba(0,123,255,0.12);

  filter: blur(25px);

  top: -35px;
  right: -35px;

  transition: transform 0.5s ease, width 0.5s ease, height 0.5s ease, background 0.5s ease;
  pointer-events: none;
}

/* 3D Hover & Movement Effects */

.tool-card:hover {
  transform: translateY(-12px) rotateX(8deg) rotateY(-8deg) translateZ(10px);

  border-color: rgba(0,123,255,0.4);

  box-shadow: 
    -10px 20px 40px rgba(0,123,255,0.15),
    0 15px 25px rgba(15,23,42,0.08);
}

.tool-card:hover::before {
  transform: scaleX(1);
}

.tool-card:hover::after {
  width: 180px;
  height: 180px;
  background: rgba(0,123,255,0.22);
  transform: translate(-10px, 10px);
}


/* =========================
   ICON (Floating 3D Pop)
========================= */

.tool-icon {
  width: 65px;
  height: 65px;

  border-radius: 18px;

  display: flex;
  align-items: center;
  justify-content: center;

  margin-bottom: 15px;

  background: linear-gradient(
    135deg,
    #007bff,
    #0056b3
  );

  box-shadow: 0 8px 20px rgba(0,123,255,0.25);

  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
              box-shadow 0.5s ease;
  
  animation: float 4s ease-in-out infinite;
}

.tool-card:nth-child(even) .tool-icon {
  animation-delay: -2s;
}

.tool-card:hover .tool-icon {
  transform: translateZ(30px) translateY(-6px) rotate(-8deg) scale(1.08);

  box-shadow: 0 15px 30px rgba(0,123,255,0.45);
}

.tool-icon img {
  width: 36px;
  height: 36px;

  object-fit: contain;

  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
  transition: transform 0.4s ease;
}

.tool-card:hover .tool-icon img {
  transform: scale(1.1);
}


/* =========================
   TOOL NAME & DETAILS
========================= */

.tool-name {
  font-size: 18px;

  font-weight: 800;

  color: #1e293b;

  margin-bottom: 6px;

  transition: transform 0.4s ease, color 0.3s ease;
  transform-style: preserve-3d;
}

.tool-card:hover .tool-name {
  transform: translateZ(20px);
  color: #007bff;
}

.tool-type {
  font-size: 13px;

  color: #64748b;

  font-weight: 500;

  transition: transform 0.4s ease, color 0.3s ease;
  transform-style: preserve-3d;
}

.tool-card:hover .tool-type {
  transform: translateZ(15px);
  color: #334155;
}


/* =========================
   KEYFRAME ANIMATIONS
========================= */

@keyframes cardEntrance {
  0% {
    opacity: 0;
    transform: translateY(40px) rotateX(-15deg) scale(0.9);
  }
  100% {
    opacity: 1;
    transform: translateY(0) rotateX(0deg) scale(1);
  }
}

@keyframes fadeInDown {
  0% {
    opacity: 0;
    transform: translateY(-20px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeInUp {
  0% {
    opacity: 0;
    transform: translateY(20px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes float {
  0%, 100% {
    transform: translateY(0px);
  }
  50% {
    transform: translateY(-6px);
  }
}


/* =========================
   MOBILE RESPONSIVENESS
========================= */

@media (max-width: 600px) {

  body {
    padding: 20px 15px 40px;
  }

  .back-home {
    font-size: 14px;
    margin-bottom: 10px;
  }

  .section-title {
    margin-top: 20px;
    margin-bottom: 35px;
  }

  .section-title h2 {
    font-size: 28px;
  }

  .section-title p {
    font-size: 13px;
  }

  .tools-container {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .tool-card {
    min-height: 140px;
  }
  
  .tool-card:hover {
    transform: translateY(-5px) scale(1.02);
  }
}

</style>
</head>

<!-- OPTIONAL: Interactive 3D Parallax Tilt Script -->
<script>
  const cards = document.querySelectorAll('.tool-card');

  cards.forEach(card => {
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      const rotateX = (y - centerY) / 8;
      const rotateY = (centerX - x) / 8;
      
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateZ(12px)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
    });
  });
</script>
